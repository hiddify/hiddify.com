<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Inter, Segoe UI, Roboto, sans-serif" direction="ltr" role="img" aria-label="How the Hiddify Manager Docker install is laid out">
<defs>
<linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#455fe9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity=".18"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
</defs>
<rect x="10" y="10" width="860" height="410" rx="26" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="30" y="46" text-anchor="start" font-size="19" font-weight="800" fill="#0f172a">Ubuntu server + Docker</text>
<text x="30" y="70" text-anchor="start" font-size="13" fill="#64748b">Host network: ports 80, 443 and the proxy ports open directly on the server</text>
<!-- containers -->
<g filter="url(#s)">
<rect x="40" y="96" width="370" height="188" rx="20" fill="#fff" stroke="url(#g1)" stroke-width="2.5"/>
<rect x="440" y="96" width="190" height="84" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="440" y="200" width="190" height="84" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
</g>
<rect x="40" y="96" width="370" height="40" rx="20" fill="url(#g1)"/><rect x="40" y="116" width="370" height="20" fill="url(#g1)"/>
<text x="225" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">hiddifymanager</text>
<g font-size="13" fill="#334155" text-anchor="middle">
<text x="225" y="165">Admin panel and user page</text>
<text x="225" y="190">Xray · hiddify-core · HAProxy</text>
<text x="225" y="215">Proxies, WARP, Telegram proxy</text>
<text x="225" y="240">The hiddify command (admin menu)</text>
</g>
<text x="225" y="270" text-anchor="middle" font-size="11.5" fill="#64748b">ghcr.io/hiddify/hiddify-manager</text>
<text x="535" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">mariadb</text>
<text x="535" y="154" text-anchor="middle" font-size="12.5" fill="#64748b">Database: users, settings</text>
<text x="535" y="234" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">redis</text>
<text x="535" y="258" text-anchor="middle" font-size="12.5" fill="#64748b">Fast cache, usage stats</text>
<path d="M410 150 H438" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<path d="M410 240 H438" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<!-- folder -->
<g filter="url(#s)"><rect x="660" y="96" width="190" height="188" rx="18" fill="#fff" stroke="url(#g2)" stroke-width="2.5"/></g>
<path d="M680 116h40l8 9h102a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H686a6 6 0 0 1-6-6z" fill="url(#g2)"/>
<text x="755" y="146" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" direction="ltr">hiddify-manager/</text>
<g font-size="12.5" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" direction="ltr">
<text x="755" y="190">docker-compose.yml</text>
<text x="755" y="214">docker.env</text>
<text x="755" y="238" font-weight="700" fill="#047857">docker-data/</text>
</g>
<text x="755" y="266" text-anchor="middle" font-size="11.5" fill="#64748b">All your data stays here</text>
<path d="M630 240 H658" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<!-- bottom: user flow -->
<g font-size="13" text-anchor="middle">
<rect x="40" y="318" width="250" height="70" rx="16" fill="#eef2ff"/>
<text x="165" y="347" font-weight="800" fill="#3949d6">1. One command</text>
<text x="165" y="370" fill="#475569">Installs Docker and all three containers</text>
<rect x="315" y="318" width="250" height="70" rx="16" fill="#ecfdf5"/>
<text x="440" y="347" font-weight="800" fill="#047857">2. Admin link</text>
<text x="440" y="370" fill="#475569">Shown in the logs</text>
<rect x="590" y="318" width="260" height="70" rx="16" fill="#fdf4ff"/>
<text x="720" y="347" font-weight="800" fill="#7e22ce">3. Easy updates</text>
<text x="720" y="370" fill="#475569">docker compose pull &amp;&amp; up -d</text>
</g>
</svg>
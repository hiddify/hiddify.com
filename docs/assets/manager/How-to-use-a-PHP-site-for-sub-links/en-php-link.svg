<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Inter, Segoe UI, Roboto, sans-serif" role="img" aria-label="In the user link only the domain is replaced with the PHP site address; the rest of the link stays the same">
<defs><filter id="s" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1e293b" flood-opacity=".14"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker></defs>
<rect x="6" y="6" width="888" height="288" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="42" y="44" text-anchor="start" direction="ltr" font-size="14" font-weight="800" fill="#64748b">The user's link from the panel</text>
<g filter="url(#s)"><rect x="40" y="58" width="820" height="56" rx="14" fill="#fff" stroke="#e2e8f0"/></g>
<g direction="ltr" font-family="ui-monospace, JetBrains Mono, Menlo, Consolas, monospace" font-size="17">
<text x="62" y="93"><tspan fill="#94a3b8">https://</tspan><tspan fill="#64748b" text-decoration="line-through">sub.yourdomain.com</tspan><tspan fill="#334155">/&lt;client proxy path&gt;/&lt;user UUID&gt;/</tspan></text>
</g>
<path d="M560 118 C 560 148, 600 160, 640 172" fill="none" stroke="#10b981" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="42" y="162" text-anchor="start" direction="ltr" font-size="14" font-weight="800" fill="#047857">The link through the PHP site</text>
<g filter="url(#s)"><rect x="40" y="176" width="820" height="56" rx="14" fill="#fff" stroke="#10b981" stroke-width="2"/></g>
<g direction="ltr" font-family="ui-monospace, JetBrains Mono, Menlo, Consolas, monospace" font-size="17">
<text x="62" y="211"><tspan fill="#94a3b8">https://</tspan><tspan fill="#047857" font-weight="700">hello2freeworld.phpsite.com</tspan><tspan fill="#334155">/&lt;client proxy path&gt;/&lt;user UUID&gt;/</tspan></text>
</g>
<text x="450" y="266" text-anchor="middle" font-size="13" fill="#475569">Only the domain changes; the path and the user's UUID stay the same</text>
</svg>
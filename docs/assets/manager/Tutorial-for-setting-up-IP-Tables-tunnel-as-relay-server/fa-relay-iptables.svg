<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="کاربران به سرور میانی وصل می‌شوند و سرور میانی با IP-Tables ترافیک را به سرور اصلی می‌رساند">
<defs>
<linearGradient id="gB" x1="0" x2="1"><stop offset="0" stop-color="#455fe9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="gM" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#f97316cc"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1e293b" flood-opacity=".15"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#cbd5e1"/></pattern>
</defs>
<rect x="6" y="6" width="888" height="348" rx="26" fill="#f8fafc" stroke="#e2e8f0"/>
<!-- country / abroad zones -->
<rect x="24" y="28" width="520" height="250" rx="22" fill="url(#dots)" opacity=".7"/>
<text x="40" y="54" font-size="13" font-weight="700" fill="#64748b">داخل کشور</text>
<rect x="590" y="28" width="286" height="250" rx="22" fill="#eef2ff" opacity=".7"/>
<text x="606" y="54" font-size="13" font-weight="700" fill="#4f46e5">خارج</text>
<!-- users -->
<g filter="url(#sh)"><rect x="50" y="96" width="150" height="132" rx="20" fill="#fff" stroke="#e2e8f0"/></g>
<g fill="#455fe9"><circle cx="125" cy="134" r="13"/><path d="M103 174c0-14 10-22 22-22s22 8 22 22z"/></g>
<g fill="#a5b4fc"><circle cx="95" cy="142" r="9"/><path d="M79 174c0-11 7-17 16-17s16 6 16 17z"/><circle cx="155" cy="142" r="9"/><path d="M139 174c0-11 7-17 16-17s16 6 16 17z"/></g>
<text x="125" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">کاربران</text>
<!-- relay -->
<g filter="url(#sh)"><rect x="300" y="86" width="200" height="152" rx="20" fill="#fff" stroke="url(#gM)" stroke-width="2.6"/></g>
<g fill="none" stroke="#f97316" stroke-width="2.4"><rect x="372" y="104" width="56" height="18" rx="5"/><rect x="372" y="128" width="56" height="18" rx="5"/></g>
<rect x="340" y="160" width="120" height="30" rx="15" fill="url(#gM)"/>
<text x="400" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">IP-Tables</text>
<text x="400" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">سرور میانی</text>
<text x="400" y="232" text-anchor="middle" font-size="11.5" fill="#64748b" direction="ltr">relay.example.com</text>
<!-- main -->
<g filter="url(#sh)"><rect x="640" y="86" width="200" height="152" rx="20" fill="#fff" stroke="url(#gB)" stroke-width="2.6"/></g>
<g fill="none" stroke="#455fe9" stroke-width="2.4"><rect x="712" y="104" width="56" height="18" rx="5"/><rect x="712" y="128" width="56" height="18" rx="5"/><rect x="712" y="152" width="56" height="18" rx="5"/></g>
<text x="740" y="200" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">سرور اصلی</text>
<text x="740" y="220" text-anchor="middle" font-size="11.5" fill="#64748b">هیدیفای‌منیجر</text>
<!-- arrows -->
<path d="M202 162 H296" stroke="#475569" stroke-width="2.6" marker-end="url(#ar)"/>
<text x="249" y="152" text-anchor="middle" font-size="11.5" fill="#64748b">اتصال کاربر</text>
<path d="M502 162 H636" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<text x="569" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f97316">تونل</text>
<text x="569" y="182" text-anchor="middle" font-size="11" fill="#64748b">پورت ۸۰ و ۴۴۳</text>
<!-- note -->
<text x="450.0" y="318" text-anchor="middle" font-size="13" fill="#475569" direction="rtl">IP-Tables بسته‌ها را در هستهٔ لینوکس مستقیم به آی‌پی سرور اصلی می‌فرستد؛ سریع و بدون برنامهٔ اضافه</text>
</svg>
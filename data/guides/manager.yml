# The manager guide page (docs/manager/index.md and index.fa.md) is built from this file:
#   make guide-pages        (tools/guide_page.py)
# Each article is a path under docs/ (no .md, no language suffix). Its title on the page is given here
# (fa / en); without one, the article's own title is used. New articles are added here by
# tools/guide_links.py (make guides), and new videos by tools/youtube_sections.py.


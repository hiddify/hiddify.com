<rect x="795" y="84" width="133" height="36" rx="18" fill="#ef44441f" stroke="#ef4444" stroke-width="1.4"/><text x="861.5" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444" font-family="Inter, Segoe UI, Roboto, sans-serif" direction="ltr">Public Ports</text>

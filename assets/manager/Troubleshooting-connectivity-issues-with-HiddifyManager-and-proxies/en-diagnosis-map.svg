<rect x="450" y="180" width="73" height="36" rx="18" fill="#f59e0b1f" stroke="#f59e0b" stroke-width="1.4"/><text x="486.5" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b" font-family="Inter, Segoe UI, Roboto, sans-serif" direction="ltr">Users</text>
<rect x="533" y="180" width="141" height="36" rx="18" fill="#f59e0b1f" stroke="#f59e0b" stroke-width="1.4"/><text x="603.5" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b" font-family="Inter, Segoe UI, Roboto, sans-serif" direction="ltr">Config Tester</text>

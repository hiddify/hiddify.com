<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 454" font-family="Inter, Segoe UI, Roboto, sans-serif" role="img" aria-label="Diagnosis map: the right panel tool for each symptom">
<defs><filter id="s" x="-5%" y="-30%" width="110%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e293b" flood-opacity=".13"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect x="6" y="6" width="968" height="442" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="34" y="44" direction="ltr" text-anchor="start" font-size="15" font-weight="800" fill="#0f172a">Symptom</text>
<text x="450" y="44" direction="ltr" text-anchor="start" font-size="15" font-weight="800" fill="#0f172a">Panel tool</text>

<rect x="576" y="276" width="98" height="36" rx="18" fill="#8b5cf61f" stroke="#8b5cf6" stroke-width="1.4"/><text x="625.0" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#8b5cf6" font-family="Inter, Segoe UI, Roboto, sans-serif" direction="ltr">Fragment</text>
<rect x="684" y="276" width="124" height="36" rx="18" fill="#8b5cf61f" stroke="#8b5cf6" stroke-width="1.4"/><text x="746.0" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#8b5cf6" font-family="Inter, Segoe UI, Roboto, sans-serif" direction="ltr">REALITY SNI</text>
<g filter="url(#s)"><rect x="26" y="352" width="380" height="76" rx="18" fill="#fff" stroke="#0ea5e9" stroke-width="2"/></g>
<circle cx="60" cy="390" r="18" fill="#0ea5e9"/><text x="60" y="396" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text>
<text x="90" y="385" direction="ltr" text-anchor="start" font-size="15" font-weight="800" fill="#0f172a">The panel does not open either</text>
<text x="90" y="408" direction="ltr" text-anchor="start" font-size="12.5" fill="#64748b">Check over SSH</text>
<path d="M412 390 H440" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="450" y="372" width="147" height="36" rx="18" fill="#0ea5e91f" stroke="#0ea5e9" stroke-width="1.4"/><text x="523.5" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#0ea5e9" font-family="ui-monospace, Menlo, monospace" direction="ltr">hiddify status</text>
<rect x="607" y="372" width="139" height="36" rx="18" fill="#0ea5e91f" stroke="#0ea5e9" stroke-width="1.4"/><text x="676.5" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#0ea5e9" font-family="ui-monospace, Menlo, monospace" direction="ltr">hiddify admin</text>

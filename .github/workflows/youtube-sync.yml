# Keeps the guide pages up to date, by itself (user 2026-11-20: no pull request to wait for):
# The app and manager guide pages (docs/app/index*.md, docs/manager/index*.md) are built from
# data/guides/*.yml by tools/guide_page.py.
# 1. Articles: every article of docs/app, docs/manager/<category>/ and the Core main pages that the
#    data file does not list yet is added, in the category of its folder (group "New"). The pages are
#    rebuilt too, which refreshes the "added" and "updated" dates behind the New / Updated badges.
#    Runs when articles or the data files are pushed to main.
# 2. New videos: once a day (and on demand from the Actions tab) it reads youtube.com/@hiddify's
#    RSS feed and adds new long videos (Shorts are skipped) to the guide pages (first category of
#    their page; move them if needed) and to docs/instagram/index*.md (a square tile per video).
# The changes are committed straight to main, and the "ci" workflow is started to deploy the site (a
# push made with the workflow's own token does not start other workflows by itself, and does not start
# this one again). A new manager video goes to the top of the first category of the manager guide; move
# it in data/guides/manager.yml if it belongs elsewhere.
#
# Repo settings needed: Settings > Actions > General > Workflow permissions:
#   "Read and write permissions" and "Allow GitHub Actions to create and approve pull requests".
name: youtube-sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/app/**.md'
      - 'docs/manager/**.md'
      - 'docs/core/*.md'
      - 'data/guides/**'
  schedule:
    - cron: '30 5 * * *'   # every day 05:30 UTC (09:00 Tehran)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the "ci" deploy

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the dates behind the New / Updated badges

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and the Persian font
        run: |
          pip install pillow pyyaml
          sudo apt-get install -y libfribidi0 >/dev/null
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL -o "$RUNNER_TEMP/fonts/Vazirmatn-Bold.ttf" \
            https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm: Persian text would be broken'"

      - name: Add new articles to the guide pages
        run: make guides | tee "$RUNNER_TEMP/articles.txt"

      - name: Update the pages from the channel
        # the channel's feed is down now and then: new articles still get their pull request
        continue-on-error: true
        env:
          YT_SOURCE: rss
          INSTAGRAM_FONT: ${{ runner.temp }}/fonts/Vazirmatn-Bold.ttf
        run: make youtube

      - name: Publish (commit to main and deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain docs data)" ]; then
            echo "No new videos or articles."
            exit 0
          fi
          articles=$(grep -E '^  \+ ' "$RUNNER_TEMP/articles.txt" | sed 's/^  + /- /' | sort -u)
          new=$(git diff -U0 -- data/guides/videos.yml | grep -oE '^\+"[A-Za-z0-9_-]{11}"' | tr -d '+"' | sort -u)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs data
          git commit -q -F - <<EOF
          Guide pages: new videos and articles

          New articles: ${articles:-none}
          New videos: ${new:-none}
          EOF
          # main may have moved while this ran: rebase and try again
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
          done
          gh workflow run manual.yml --ref main
          echo "Published, and the deploy (ci) started."

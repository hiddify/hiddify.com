# Keeps the guide pages up to date, in a pull request:
# The app and manager guide pages (docs/app/index*.md, docs/manager/index*.md) are built from
# data/guides/*.yml by tools/guide_page.py.
# 1. Articles: every article of docs/app, docs/manager/<category>/ and the Core main pages that the
#    data file does not list yet is added, in the category of its folder (group "New"). The pages are
#    rebuilt too, which refreshes the "added" and "updated" dates behind the New / Updated badges.
#    Runs when articles or the data files are pushed to main.
# 2. New videos: once a day (and on demand from the Actions tab) it reads youtube.com/@hiddify's
#    RSS feed and adds new long videos (Shorts are skipped) to the guide pages (first category of
#    their page; move them if needed) and to docs/instagram/index*.md (a square tile per video).
# and opens (or updates) the pull request "youtube-sync" for review. Merging it deploys the site
# through the existing "ci" workflow. Nothing is pushed to main by this workflow.
#
# Repo settings needed: Settings > Actions > General > Workflow permissions:
#   "Read and write permissions" and "Allow GitHub Actions to create and approve pull requests".
name: youtube-sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/app/**.md'
      - 'docs/manager/**.md'
      - 'docs/core/*.md'
      - 'data/guides/**'
  schedule:
    - cron: '30 5 * * *'   # every day 05:30 UTC (09:00 Tehran)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the dates behind the New / Updated badges

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and the Persian font
        run: |
          pip install pillow pyyaml
          sudo apt-get install -y libfribidi0 >/dev/null
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL -o "$RUNNER_TEMP/fonts/Vazirmatn-Bold.ttf" \
            https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm: Persian text would be broken'"

      - name: Add new articles to the guide pages
        run: make guides | tee "$RUNNER_TEMP/articles.txt"

      - name: Update the pages from the channel
        # the channel's feed is down now and then: new articles still get their pull request
        continue-on-error: true
        env:
          YT_SOURCE: rss
          INSTAGRAM_FONT: ${{ runner.temp }}/fonts/Vazirmatn-Bold.ttf
        run: make youtube

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain docs data)" ]; then
            echo "No new videos or articles."
            exit 0
          fi
          new=$( { git diff -U0 -- data/guides/videos.yml | grep -oE '^\+"[A-Za-z0-9_-]{11}"' | tr -d '+"';
                   git diff -U0 -- docs/instagram | grep -oE '^\+.*watch\?v=[A-Za-z0-9_-]{11}' | grep -oE '[A-Za-z0-9_-]{11}$'; } | sort -u)
          titles=$([ -z "$new" ] || python - $new <<'EOF'
          import sys, os
          sys.path.insert(0, 'tools')
          from yt_channel import long_videos
          ids = set(sys.argv[1:])
          for v, d, t in long_videos():
              if v in ids: print(f'- [{t}](https://www.youtube.com/watch?v={v}) ({d[:4]}-{d[4:6]}-{d[6:]})')
          EOF
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B youtube-sync
          git add -A docs data
          git commit -m "Add new videos and articles to the guide pages"
          git push --force origin youtube-sync
          articles=$(grep -E '^  \+ ' "$RUNNER_TEMP/articles.txt" | sed 's/^  + /- /' | sort -u)
          body=$(printf 'New videos on youtube.com/@hiddify:\n\n%s\n\nNew articles added to their guide page (fa and en):\n\n%s\n\nA new **manager** video is put at the top of the first category of the manager guide: move it to its category in this branch if needed. Merging deploys the site.\n' "${titles:-none}" "${articles:-none}")
          if gh pr view youtube-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit youtube-sync --body "$body"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head youtube-sync \
              --title "Guide pages: new videos and articles" --body "$body"
          fi
